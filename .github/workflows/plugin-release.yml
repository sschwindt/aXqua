name: release

# On a version tag: build the QGIS plugin zip, validate it against what
# plugins.qgis.org requires, and attach it to the GitHub release; then publish the aXqua
# program of the same version on PyPI (job `pypi` below).
#
# The upload to plugins.qgis.org itself is **manual**, at least for the first version:
# it needs an OSGeo ID (a GitHub-linked login on the QGIS hub is a different credential)
# and a maintainer approves a plugin's first release. Once that has happened, the
# `publish` job below can be enabled by adding the two secrets - see its comment.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Also upload the program: none, or testpypi for a rehearsal"
        type: choice
        options: ["none", "testpypi"]
        default: "none"

permissions:
  contents: write        # to attach the asset to the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the plugin metadata
        run: python scripts/build_plugin_zip.py --check

      - name: The tag and metadata.txt must agree
        # Otherwise the release asset says one version and the plugin manager another,
        # and a user's "update available" never resolves. Only for a tag: a run started
        # by hand from a branch has the branch name where the tag would be.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          meta=$(grep -m1 '^version=' qgis_plugin/axqua/metadata.txt | cut -d= -f2 | tr -d ' ')
          echo "tag=$tag metadata=$meta"
          if [ -n "$tag" ] && [ "$tag" != "$meta" ]; then
            echo "::error::tag $tag does not match metadata.txt version $meta"
            exit 1
          fi

      - name: Run the plugin tests and the security scan
        # Neither needs QGIS or a solver, so both are cheap enough to gate a release -
        # and both are what plugins.qgis.org runs on upload anyway.
        run: |
          pip install pytest bandit
          pytest qgis_plugin/tests -q
          bandit -r qgis_plugin/axqua -q

      - name: Build the zip
        # No documentation in the archive: Help opens a copy built on the computer, or
        # the published one at https://axqua.eu.
        run: python scripts/build_plugin_zip.py

      - uses: actions/upload-artifact@v4
        with:
          name: qgis-plugin
          path: dist/*.zip

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

  # The aXqua program on PyPI, from the same tag as the plugin zip: the plugin requires the
  # program of its own version (MINIMUM_VERSION in qgis_plugin/axqua/core/runner_client.py),
  # so the two are released together. PyPI never accepts a version twice, not even after a
  # deletion, so the upload runs only after the checks of the plugin, and the environment
  # `pypi` should require an approval (Settings > Environments > pypi > Required reviewers).
  #
  # OFF until the repository variable PYPI_UPLOAD is "true" (Settings > Secrets and
  # variables > Actions > Variables): until then the program is uploaded by hand with twine
  # (docs/code/plugin.rst names the commands), and a tag must not end in a red
  # run because no publisher is registered. To switch it on, register trusted publishing
  # first (no token is stored): on pypi.org, the project's Settings > Publishing (before
  # the project exists: Your account > Publishing > Add a pending publisher), with owner
  # sschwindt, repository aXqua, workflow plugin-release.yml, environment pypi. The same
  # on test.pypi.org with the environment testpypi, for a rehearsal through
  # Actions > release > Run workflow with the target testpypi.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    if: (startsWith(github.ref, 'refs/tags/') && vars.PYPI_UPLOAD == 'true') || inputs.target == 'testpypi'
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/') && 'pypi' || 'testpypi' }}
    permissions:
      contents: write    # to attach the wheel to the release
      id-token: write    # trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag and pyproject.toml must agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "tag=$tag pyproject=$declared"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $tag does not match pyproject.toml version $declared"
            exit 1
          fi

      - name: Build and check the sdist and the wheel
        run: |
          python -m pip install -q build twine
          python -m build
          twine check --strict dist/*
          python scripts/check_wheel.py dist/*.whl

      - name: Upload to TestPyPI
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A rehearsal may be repeated for the same version; TestPyPI keeps the first.
          skip-existing: true

      - name: Upload to PyPI
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A version already uploaded by hand from the same tag is kept, not an error.
          skip-existing: true

      - name: Attach the wheel to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # Enable once the plugin exists on plugins.qgis.org and OSGEO_USERNAME / OSGEO_PASSWORD
  # are set as repository secrets. Until then the first upload is done by hand at
  # https://plugins.qgis.org/plugins/add/ - a maintainer has to approve it anyway.
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qgis-plugin
          path: dist
      - name: Upload to plugins.qgis.org
        env:
          OSGEO_USERNAME: ${{ secrets.OSGEO_USERNAME }}
          OSGEO_PASSWORD: ${{ secrets.OSGEO_PASSWORD }}
        run: |
          pip install qgis-plugin-ci
          qgis-plugin-ci release "${GITHUB_REF_NAME#v}" \
            --osgeo-username "$OSGEO_USERNAME" \
            --osgeo-password "$OSGEO_PASSWORD"
