# =============================================================================
# Synthetic vertical-slot flume - does a 2D depth-averaged model over-resist a slot?
# =============================================================================
# NOT a reach. This is an instrument: a straight rectangular flume with the Munich
# VSF's design dimensions and nothing else in it, so that the head the model needs
# to pass 0.135 m3/s through fourteen slots can be compared against the head the
# structure is designed to shed. The geodata is generated by make_geodata.py, so the
# case rebuilds anywhere from two tracked files.
#
# The question (GitHub issue #3): the Munich 2D run settles 0.5 to 0.8 m higher than
# the reference model. The slots are demonstrably open and the flow through them is
# slow, so if a depth-averaged model over-resists a strongly three-dimensional slot
# jet even slightly, fourteen in series back the level up a long way.
#
# The design sheds 1.690 m over the 13 pitches between its 14 baffles - 0.130 m per
# pool. If the model needs materially more, the 2D pass interior cannot be trusted to
# set the 3D model's boundary levels.
project:
  name: slot-flume
  crs_epsg: 25832
  # everything the study produces, under one folder it owns
  model_dir: axqua-case/simulation
  preprocessing_dir: axqua-case/preprocessing
  postprocessing_dir: axqua-case/postprocessing
  calibration_dir: axqua-case/calibration-validation

telemac:
  # deliberately absent: resolved per machine (axqua.core.machine), so this file
  # travels. Set ~/.config/axqua/solvers.yml or AXQUA_TELEMAC_PYSOURCE.
  n_processors: 8

geodata:
  dem_initial: user-sources/geodata/bed.tif
  boundary: user-sources/geodata/roi.gpkg
  # Kept for pre-wetting (the `channel` zone is what gets seeded). NO centerline:
  # mesh_zones + centerline together select the ANISOTROPIC mesher, and a slot jet is
  # normal to its baffle, so cells stretched along the flume are the wrong shape for
  # what is being measured. Without a centerline the isotropic distance-field path
  # runs instead, which is also what munich-vsf uses.
  mesh_zones: user-sources/geodata/mesh-zones.gpkg
  roughness_zones: user-sources/geodata/roughness-zones.gpkg
  roughness_table: user-sources/geodata/roughness-table.csv
  structures: user-sources/geodata/baffles.gpkg

structures:
  type_field: "Type"
  crest_field: "Crest (m)"
  width_field: "Width (m)"
  name_field: "Name"
  # As munich-vsf: a baffle stands a metre over its pool, and the 2 m default
  # freeboard meant for a river floodwall would give the solver a 3 m terrain step.
  solid_freeboard_2d: 0.5

boundaries:
  liquid_boundaries: user-sources/geodata/liquid-boundaries.gpkg
  prescribed_flowrate: 0.135
  # Neumann. The exit sits 2 m below the last baffle on a 7.87% slope, so the flow
  # leaves supercritically and there is no downstream control to prescribe - and
  # prescribing one would put the answer into the measurement. The interior pools are
  # each controlled by their own slot, so the reported head is measured over them and
  # not over the last one.
  outflow_condition: free

initialization:
  # DRY START, and the alternative is recorded so it is not tried again. Pre-wetting
  # at a constant depth lays a water surface PARALLEL to the bed, and this bed falls
  # 7.87% - so t=0 releases a 25 m sloping body of water into fourteen walls. The
  # coarse level died on it in one second with LIMIT VALUES TRESPASSED. A fish pass
  # has a horizontal surface in each pool and a step at each slot; a constant depth is
  # the one seed shape it never has.
  #
  # Filling from dry costs ~120 s of simulated time (about 16 m3 at 0.135 m3/s) and is
  # what the structure does anyway.
  dry_start_depth: 0.30
  dry_start_extent: 6

mesh:
  # The sweep variable: the isotropic path sizes from default_size, and the study
  # drives the three levels through mesh.size_scale, which multiplies the whole
  # sizing field at once.
  default_size: 0.05
  breakline_size: 0.05
  channel_size: 0.05
  floodplain_size: 0.05
  min_size: 0.01

friction:
  roughness_law: 5               # Nikuradse, as munich-vsf
  boundary_law: 5
  boundary_coefficient: 0.02

hydrodynamics:
  regime: steady
  finite_volumes: false
  turbulence_model: 3            # k-epsilon, as specified for the comparison
  desired_courant: 0.30
  time_step: 0.02
  # The flume holds ~15 m3 at these depths and fills at 0.135 m3/s. Pre-wetted, the
  # pools need to redistribute rather than fill, but fourteen of them in series settle
  # slowly. The study stops reading at flux balance rather than at the clock.
  duration: 900.0
  graphic_printout_period: 2000
  listing_printout_period: 2000
  wet_depth: 0.005
  flux_tolerance: 1.0e-3
