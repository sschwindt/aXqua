<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aXqua: page not found</title>
<link rel="icon" href="/_static/favicon.ico">
<style>
  body { font-family: Lato, "Helvetica Neue", Arial, sans-serif; color: #404040; background: #fcfcfc;
         margin: 0; padding: 3rem 1rem; }
  main { max-width: 40rem; margin: 0 auto; }
  h1 { font-family: "Roboto Slab", Georgia, serif; font-weight: 700; }
  a { color: #2980b9; }
  section { margin-bottom: 2rem; }
</style>
</head>
<body>
<main>
<img src="/_static/aXqua-icon-reduced.png" alt="aXqua" width="96" height="96">
<section id="nf-en" lang="en"><h1>Page not found</h1><p>This page does not exist (anymore). The documentation starts at <a href="/">axqua.eu/</a>.</p></section>
<section id="nf-de" lang="de"><h1>Seite nicht gefunden</h1><p>Diese Seite gibt es nicht (mehr). Die Dokumentation beginnt bei <a href="/de/">axqua.eu/de/</a>.</p></section>
<section id="nf-fr" lang="fr"><h1>Page introuvable</h1><p>Cette page n’existe pas (ou plus). La documentation commence à <a href="/fr/">axqua.eu/fr/</a>.</p></section>
</main>
<script>
  // show the reader's language first: the one of the address, else the one of the browser
  (function () {
    var m = location.pathname.match(/^\/(de|fr)(\/|$)/);
    var lang = m ? m[1] : ((navigator.language || "en").slice(0, 2));
    var first = document.getElementById("nf-" + lang);
    if (first) first.parentNode.insertBefore(first, first.parentNode.querySelector("section"));
  })();
</script>
</body>
</html>
