[build-system]
# 77: the license expression and license-files of PEP 639.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Branded on PyPI; the import package is plain lowercase `axqua`, because a mixed-case
# module name resolves differently on case-insensitive filesystems. PyPI normalizes the
# two to the same project, so `pip install aXqua` and `pip install axqua` both work.
name = "aXqua"
version = "1.0.1"
description = "Automated setup, persistent execution and calibration of river models - TELEMAC-2D/3D with GAIA, and OpenFOAM interFoam - with a QGIS frontend."
readme = "README.md"
requires-python = ">=3.10"
# aXqua is BSD-3-Clause. The wheel also carries the vendored OpenFOAM installer (MIT) and
# Olsen's solver sources (GPL-3.0-or-later), which aXqua runs as separate programs and
# never imports or links (NOTICE); PyPI shows this expression, so it names all three.
license = "BSD-3-Clause AND MIT AND GPL-3.0-or-later"
license-files = [
    "LICENSE",
    "NOTICE",
    "src/axqua/install/vendor/OpenFOAM-installer/LICENSE",
    "src/axqua/install/vendor/OpenFOAM-installer/LICENSES/*",
]
authors = [{ name = "Sebastian Schwindt" }]
keywords = ["TELEMAC", "OpenFOAM", "river modeling", "hydraulics", "sediment transport",
            "Bayesian calibration", "QGIS", "mesh generation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: GIS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyyaml",
    "pyproj",
    "shapely>=2.0",
    "geopandas",
    "rasterio",
    "gmsh>=4.13",
    "openpyxl>=3.1",
    # flux-convergence + cross-section plots and the P1 triangle interpolation
    # (axqua.flux_convergence, axqua.sections); previously pulled in
    # transitively by pythomac, which the flux analysis no longer uses.
    "matplotlib",
]

[project.urls]
Documentation = "https://axqua.eu"
Source = "https://github.com/sschwindt/aXqua"
Issues = "https://github.com/sschwindt/aXqua/issues"
Releases = "https://github.com/sschwindt/aXqua/releases"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
gui = ["streamlit>=1.30"]
# Surrogate-assisted Bayesian calibration (axqua.bayescal / axqua.calibration).
# An EXTRA rather than a core dependency: it pulls in bayesvalidrox, gpytorch and
# scikit-learn, none of which is needed to build or run a TELEMAC case, which is what
# most of axqua does.
#
# VERSION POLICY: a floor, never a ceiling. HydroBayesCal is developed alongside
# axqua by the same group, and its releases are bugfixes plus ADDITIVE features -
# nothing is removed. So the newest release is always the one to want, and an upper
# bound would only stop a user getting a fix. `pip install 'axqua[calibration]'`
# therefore resolves to the latest, and that is intended, not an oversight.
#
# The floor is the oldest release carrying a capability axqua actually uses, so a
# too-old install fails at install time rather than halfway through a calibration.
# What each step added, for the record:
#   1.4.2  ships the calibration drivers WITH the package (hydroBayesCal.copy_driver);
#          before it they lived only in a source checkout that axqua had to be told
#          the location of, which broke whenever it moved.
#   1.4.3  hoists save_calibration_data into HydroSimulations, fixing the "truth
#          value of an array is ambiguous" crash on BAL's first iteration once for
#          every binding, and writing the restart CSV that --resume relies on.
#   1.4.4  makes the MULTI-FLOW driver honor the config's `extraction` block;
#          before it, multi-flow silently averaged the last frames while single-flow
#          on the same config did not, so the two were fitted to different data.
#
# Beyond the floor, axqua does NOT check versions: `hbc.require_hbc` tests for the
# capability it needs (hasattr(hydroBayesCal, "copy_driver")). On an additive-only
# upstream that is the right test - a version comparison would need editing on every
# release, and would reject a valid newer one the moment the scheme changed.
calibration = ["hydrobayescal>=1.8.1"]

[project.scripts]
axqua = "axqua.cli:main"
axqua-gui = "axqua.gui.launch:main"

# Solver backends are discovered through this group, so a third solver is a
# `pip install axqua-<name>` rather than a fork. The built-ins register through the
# same mechanism they document, with a hard-coded fallback in core/registry.py for a
# source checkout that has not been re-installed.
[project.entry-points."axqua.solvers"]
telemac = "axqua.solvers.telemac.spec:SPEC"
openfoam = "axqua.solvers.openfoam.spec:SPEC"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
axqua = ["install/vendor/**/*"]

# The vendor glob above takes everything, also the bytecode a run of the installer's own
# tests leaves in a working tree. A wheel built from such a tree must not carry it.
[tool.setuptools.exclude-package-data]
axqua = ["**/__pycache__/*", "*.pyc"]

[tool.ruff]
line-length = 100
# A copy of another project, kept as close to its original as possible (VENDORED.md).
extend-exclude = ["src/axqua/install/vendor"]

[tool.ruff.lint]
# Pinned EXPLICITLY rather than left to ruff's defaults: those defaults widened in
# ruff 0.16, so the same `ruff check src/` went from clean to 88 findings purely by
# upgrading ruff on one machine (all of them style nits - intentional multi-line
# prose flagged as ISC004, deliberate `except Exception` reporting as BLE001).
# Naming the rule set makes the lint contract the same on every machine and in CI.
select = ["E4", "E7", "E9", "F"]
